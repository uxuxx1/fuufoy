<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Casino</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Стили такие же как были, не меняю для краткости */
:root {
  --bg: #0d0d14;
  --card: #15151f;
  --border: #252535;
  --gold: #f0b429;
  --gold2: #e07b00;
  --green: #3ddc84;
  --text: #f0eaff;
  --muted: #5a556e;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Nunito', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-bottom: 90px;
}
.topbar { width: 100%; display: flex; justify-content: space-between; padding: 14px 16px; }
.logo { font-family: 'Bebas Neue', sans-serif; font-size: 26px; color: var(--gold); }
.balance-pill { background: var(--card); border: 1px solid var(--border); border-radius: 99px; padding: 6px 14px; display: flex; gap: 5px; }
.tabs { display: flex; gap: 4px; background: var(--card); border-radius: 12px; padding: 4px; margin: 0 16px; width: calc(100% - 32px); }
.tab { flex: 1; padding: 8px; background: none; color: var(--muted); font-weight: 700; cursor: pointer; }
.tab.active { background: var(--border); color: var(--text); }
.page { width: 100%; display: none; flex-direction: column; align-items: center; }
.page.active { display: flex; }
.machine { width: calc(100% - 32px); max-width: 360px; background: var(--card); border-radius: 20px; padding: 16px; }
.reels-outer { background: #080810; border-radius: 12px; padding: 4px; overflow: hidden; }
.reels { display: flex; gap: 4px; }
.reel { flex: 1; height: 276px; overflow: hidden; }
.reel-inner { display: flex; flex-direction: column; }
.sym-cell { height: 92px; display: flex; align-items: center; justify-content: center; font-size: 64px; }
.spin-btn { width: 100%; height: 52px; background: linear-gradient(135deg, #e07b00, #f0b429); border: none; border-radius: 12px; font-size: 22px; font-weight: bold; margin-top: 8px; cursor: pointer; }
.win-msg { text-align: center; font-size: 14px; padding: 8px; }
.stats { display: flex; gap: 8px; margin-top: 10px; }
.stat { background: var(--card); border-radius: 12px; padding: 10px; flex: 1; text-align: center; }
.paytable-btn { background: none; border: 1px solid var(--border); border-radius: 10px; color: var(--muted); padding: 7px; margin-top: 10px; cursor: pointer; width: 100%; }
.paytable-box { display: none; background: #080810; border-radius: 10px; padding: 12px; margin-top: 6px; }
.paytable-box.open { display: block; }
.pt-row { display: flex; justify-content: space-between; padding: 6px 0; }
.inv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.inv-card { background: var(--card); border-radius: 14px; padding: 14px; text-align: center; }
.inv-letter { font-size: 52px; font-weight: 800; color: var(--gold); }
.withdraw-btn { background: #2a2a3e; border: none; border-radius: 8px; color: white; padding: 7px; margin-top: 8px; cursor: pointer; width: 100%; }
.toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #1e1e2e; border-radius: 10px; padding: 10px 20px; opacity: 0; transition: all .3s; pointer-events: none; }
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">CASINO</div>
  <div class="balance-pill"><span>⭐</span><span id="balVal">0</span></div>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('slots')">Слоты</button>
  <button class="tab" onclick="switchTab('inv')">Инвентарь</button>
</div>

<div class="page active" id="page-slots">
  <div class="machine">
    <div class="reels-outer" id="reelsOuter">
      <div class="reels">
        <div class="reel"><div class="reel-inner" id="ri0"></div></div>
        <div class="reel"><div class="reel-inner" id="ri1"></div></div>
        <div class="reel"><div class="reel-inner" id="ri2"></div></div>
      </div>
    </div>
    <div class="win-msg muted" id="winMsg">Нажми крутить!</div>
    <button class="spin-btn" id="spinBtn" onclick="spin()">КРУТИТЬ</button>
    <div class="cost-label">30 ⭐ за спин</div>
    <button class="paytable-btn" onclick="togglePt(this)">Таблица выплат</button>
    <div class="paytable-box" id="ptBox">
      <div class="pt-row"><span>777</span><span>Сигара</span><span>0.1%</span></div>
      <div class="pt-row"><span>🍌🍌🍌</span><span>Факел</span><span>0.5%</span></div>
      <div class="pt-row"><span>🍋🍋🍋</span><span>Рамен</span><span>0.5%</span></div>
      <div class="pt-row"><span>🍏🍏🍏</span><span>Змея</span><span>0.5%</span></div>
      <div class="pt-row"><span>🍒🍒🍒</span><span>Мороженое</span><span>0.5%</span></div>
      <div class="pt-row"><span>🍇🍇🍇</span><span>Happy B-day</span><span>0.5%</span></div>
      <div class="pt-row"><span>🍌🍌🍋 и тд</span><span>+5⭐</span><span>10%</span></div>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><div>Спинов</div><div id="sSpins">0</div></div>
    <div class="stat"><div>Выиграно</div><div id="sWon">0</div></div>
  </div>
</div>

<div class="page" id="page-inv">
  <div class="inv-page"><div id="invContent"></div></div>
</div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
tg?.expand();
const initData = tg?.initData || "";
const API = window.location.origin;

// ГЛАВНОЕ: функция преобразования символа в эмодзи
function getEmoji(sym) {
  const map = {
    "seven": "7",
    "banana": "🍌",
    "lemon": "🍋",
    "apple": "🍏",
    "cherry": "🍒",
    "grape": "🍇"
  };
  return map[sym] || "?";
}

const ALL_SYMS = ["banana", "lemon", "apple", "cherry", "grape", "seven"];
let spinning = false;
let stats = { spins: 0, won: 0 };

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && tab === 'slots') || (i === 1 && tab === 'inv'));
  });
  document.getElementById('page-' + (tab === 'slots' ? 'slots' : 'inv')).classList.toggle('active', true);
  document.getElementById('page-' + (tab === 'slots' ? 'inv' : 'slots')).classList.toggle('active', false);
  if (tab === 'inv') loadInventory();
}

const EXTRA = 12;
const CELL_H = 92;

function buildReel(id, finalSyms) {
  const inner = document.getElementById(id);
  inner.innerHTML = '';
  inner.style.transition = 'none';
  inner.style.transform = 'translateY(0)';
  
  const total = EXTRA * ALL_SYMS.length + 3;
  const strip = [];
  for (let i = 0; i < total - 3; i++) {
    strip.push(ALL_SYMS[Math.floor(Math.random() * ALL_SYMS.length)]);
  }
  strip.push(...finalSyms);
  
  strip.forEach(sym => {
    const cell = document.createElement('div');
    cell.className = 'sym-cell';
    cell.textContent = getEmoji(sym);
    inner.appendChild(cell);
  });
  return total;
}

function animReel(id, total, delay, duration) {
  return new Promise(res => {
    setTimeout(() => {
      const inner = document.getElementById(id);
      const targetY = -((total - 3) * CELL_H);
      inner.style.transition = `transform ${duration}s cubic-bezier(0.22, 0.68, 0, 1.2)`;
      inner.style.transform = `translateY(${targetY}px)`;
      inner.addEventListener('transitionend', res, { once: true });
    }, delay);
  });
}

function initReels() {
  for (let i = 0; i < 3; i++) {
    const syms = [ALL_SYMS[0], ALL_SYMS[1], ALL_SYMS[2]];
    buildReel(`ri${i}`, syms);
  }
}

async function spin() {
  if (spinning) return;
  spinning = true;
  
  const btn = document.getElementById('spinBtn');
  const msg = document.getElementById('winMsg');
  const outer = document.getElementById('reelsOuter');
  
  btn.disabled = true;
  msg.textContent = '';
  outer.classList.remove('win');
  
  const apiCall = fetch(`${API}/api/spin`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ init_data: initData })
  }).then(r => r.json()).catch(e => ({ error: e.message }));
  
  // Быстрая прокрутка
  for (let i = 0; i < 3; i++) {
    const syms = [ALL_SYMS[Math.floor(Math.random() * ALL_SYMS.length)], 
                  ALL_SYMS[Math.floor(Math.random() * ALL_SYMS.length)], 
                  ALL_SYMS[Math.floor(Math.random() * ALL_SYMS.length)]];
    buildReel(`ri${i}`, syms);
  }
  await new Promise(r => requestAnimationFrame(r));
  
  const fakeP = [];
  for (let i = 0; i < 3; i++) {
    const total = document.getElementById(`ri${i}`).children.length;
    fakeP.push(animReel(`ri${i}`, total, i * 80, 0.55));
  }
  
  const [result] = await Promise.all([apiCall, Promise.all(fakeP)]);
  
  if (result.error) {
    msg.textContent = result.error;
    spinning = false;
    btn.disabled = false;
    return;
  }
  
  // Финальная остановка на реальных символах
  for (let i = 0; i < 3; i++) {
    buildReel(`ri${i}`, result.symbols);
  }
  await new Promise(r => requestAnimationFrame(r));
  
  const finalP = [];
  for (let i = 0; i < 3; i++) {
    const total = document.getElementById(`ri${i}`).children.length;
    finalP.push(animReel(`ri${i}`, total, i * 100, 0.45));
  }
  await Promise.all(finalP);
  
  document.getElementById('balVal').textContent = result.balance;
  stats.spins++;
  
  if (result.type === 'jackpot' || result.type === 'three') {
    outer.classList.add('win');
    msg.className = 'win-msg gold';
    msg.textContent = `Выиграл ${result.gift.name}!`;
    stats.won++;
    showToast(`${result.gift.name} в инвентаре!`);
  } else if (result.type === 'two') {
    msg.className = 'win-msg green';
    msg.textContent = '+5 ⭐';
    stats.won++;
  } else {
    msg.className = 'win-msg muted';
    msg.textContent = '—';
  }
  
  document.getElementById('sSpins').textContent = stats.spins;
  document.getElementById('sWon').textContent = stats.won;
  
  spinning = false;
  btn.disabled = false;
}

async function loadInventory() {
  const cont = document.getElementById('invContent');
  cont.innerHTML = 'Загрузка...';
  try {
    const res = await fetch(`${API}/api/inventory?init_data=${encodeURIComponent(initData)}`);
    const data = await res.json();
    const items = data.items || [];
    if (!items.length) {
      cont.innerHTML = 'Инвентарь пуст';
      return;
    }
    const grid = document.createElement('div');
    grid.className = 'inv-grid';
    const letters = { 'Сигара': 'С', 'Факел': 'Ф', 'Рамен': 'Р', 'Змея': 'З', 'Мороженое': 'М', 'Happy B-day': 'Д' };
    items.forEach(item => {
      const div = document.createElement('div');
      div.className = 'inv-card';
      div.innerHTML = `<div class="inv-letter">${letters[item.gift_name] || '?'}</div>
                       <div>${item.gift_name}</div>
                       <button class="withdraw-btn" onclick="withdraw(${item.id}, this)">Вывести</button>`;
      grid.appendChild(div);
    });
    cont.innerHTML = '';
    cont.appendChild(grid);
  } catch(e) {
    cont.innerHTML = 'Ошибка';
  }
}

async function withdraw(itemId, btn) {
  btn.disabled = true;
  btn.textContent = '...';
  try {
    const res = await fetch(`${API}/api/withdraw`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ init_data: initData, item_id: itemId })
    });
    const data = await res.json();
    if (data.ok) {
      btn.closest('.inv-card')?.remove();
      showToast('Запрос отправлен');
    } else {
      btn.disabled = false;
      btn.textContent = 'Вывести';
    }
  } catch(e) {
    btn.disabled = false;
    btn.textContent = 'Вывести';
  }
}

function showToast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function togglePt(btn) {
  document.getElementById('ptBox').classList.toggle('open');
}

async function loadBalance() {
  try {
    const r = await fetch(`${API}/api/balance?init_data=${encodeURIComponent(initData)}`);
    const d = await r.json();
    document.getElementById('balVal').textContent = d.balance ?? 0;
  } catch {}
}

initReels();
loadBalance();
</script>
</body>
  </html>
