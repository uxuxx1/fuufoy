<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Casino</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #0d0d14;
  --card: #15151f;
  --border: #252535;
  --gold: #f0b429;
  --text: #f0eaff;
  --muted: #5a556e;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-bottom: 90px;
}
.topbar { width: 100%; display: flex; justify-content: space-between; padding: 14px 16px; }
.logo { font-size: 26px; font-weight: bold; color: var(--gold); }
.balance-pill { background: #15151f; border-radius: 99px; padding: 6px 14px; display: flex; gap: 5px; }
.tabs { display: flex; gap: 4px; background: #15151f; border-radius: 12px; padding: 4px; margin: 0 16px; width: calc(100% - 32px); }
.tab { flex: 1; padding: 8px; background: none; color: #5a556e; font-weight: 700; cursor: pointer; }
.tab.active { background: #252535; color: white; }
.page { width: 100%; display: none; flex-direction: column; align-items: center; }
.page.active { display: flex; }
.machine { width: calc(100% - 32px); max-width: 360px; background: #15151f; border-radius: 20px; padding: 16px; }
.reels-outer { background: #080810; border-radius: 12px; padding: 4px; }
.reels { display: flex; gap: 4px; }
.reel { flex: 1; height: 276px; overflow: hidden; position: relative; background: #00000020; border-radius: 8px; }
.reel-inner { display: flex; flex-direction: column; transition: transform 0.4s cubic-bezier(0.25, 0.1, 0.15, 1); }
.sym-cell { height: 92px; display: flex; align-items: center; justify-content: center; font-size: 64px; }
.spin-btn { width: 100%; height: 52px; background: linear-gradient(135deg, #e07b00, #f0b429); border: none; border-radius: 12px; font-size: 22px; font-weight: bold; margin-top: 8px; cursor: pointer; }
.spin-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.win-msg { text-align: center; font-size: 14px; padding: 8px; min-height: 50px; }
.stats { display: flex; gap: 8px; margin-top: 10px; }
.stat { background: #15151f; border-radius: 12px; padding: 10px; flex: 1; text-align: center; }
.paytable-btn { background: none; border: 1px solid #252535; border-radius: 10px; color: #5a556e; padding: 7px; margin-top: 10px; cursor: pointer; width: 100%; }
.paytable-box { display: none; background: #080810; border-radius: 10px; padding: 12px; margin-top: 6px; }
.paytable-box.open { display: block; }
.pt-row { display: flex; justify-content: space-between; padding: 6px 0; }
.inv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.inv-card { background: #15151f; border-radius: 14px; padding: 14px; text-align: center; }
.inv-letter { font-size: 52px; font-weight: 800; color: var(--gold); }
.withdraw-btn { background: #2a2a3e; border: none; border-radius: 8px; color: white; padding: 7px; cursor: pointer; width: 100%; }
.toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #1e1e2e; border-radius: 10px; padding: 10px 20px; opacity: 0; transition: all .3s; pointer-events: none; z-index: 100; }
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">CASINO</div>
  <div class="balance-pill"><span>⭐</span><span id="balVal">0</span></div>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('slots')">Слоты</button>
  <button class="tab" onclick="switchTab('inv')">Инвентарь</button>
</div>

<div class="page active" id="page-slots">
  <div class="machine">
    <div class="reels-outer">
      <div class="reels">
        <div class="reel"><div class="reel-inner" id="ri0"></div></div>
        <div class="reel"><div class="reel-inner" id="ri1"></div></div>
        <div class="reel"><div class="reel-inner" id="ri2"></div></div>
      </div>
    </div>
    <div class="win-msg" id="winMsg">⚡ Нажми КРУТИТЬ ⚡</div>
    <button class="spin-btn" id="spinBtn" onclick="spin()">КРУТИТЬ</button>
    <div class="cost-label">30 ⭐ за спин</div>
    <button class="paytable-btn" onclick="togglePt(this)">📊 Таблица выплат</button>
    <div class="paytable-box" id="ptBox">
      <div class="pt-row"><span>777</span><span>🎁 Сигара</span><span>⭐ 1000</span></div>
      <div class="pt-row"><span>🍌🍌🍌</span><span>🎁 Факел</span><span>⭐ 0</span></div>
      <div class="pt-row"><span>🍋🍋🍋</span><span>🎁 Рамен</span><span>⭐ 0</span></div>
      <div class="pt-row"><span>🍏🍏🍏</span><span>🎁 Змея</span><span>⭐ 0</span></div>
      <div class="pt-row"><span>🍒🍒🍒</span><span>🎁 Мороженое</span><span>⭐ 0</span></div>
      <div class="pt-row"><span>🍇🍇🍇</span><span>🎁 Happy B-day</span><span>⭐ 0</span></div>
      <div class="pt-row"><span>🍌🍌🍋</span><span>✨ Два одинаковых</span><span>+5 ⭐</span></div>
      <div class="pt-row"><span>🍋🍏🍒</span><span>❌ Мимо</span><span>0 ⭐</span></div>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><div>🎰 СПИНОВ</div><div id="sSpins">0</div></div>
    <div class="stat"><div>🏆 ВЫИГРАНО</div><div id="sWon">0</div></div>
  </div>
</div>

<div class="page" id="page-inv">
  <div class="inv-page"><div id="invContent"></div></div>
</div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
tg?.expand();
const initData = tg?.initData || "";
const API = window.location.origin;

function getEmoji(sym) {
  const map = {
    "seven": "7",
    "banana": "🍌",
    "lemon": "🍋",
    "apple": "🍏",
    "cherry": "🍒",
    "grape": "🍇"
  };
  return map[sym] || "❓";
}

let spinning = false;
let stats = { spins: 0, won: 0 };

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && tab === 'slots') || (i === 1 && tab === 'inv'));
  });
  document.getElementById('page-slots').classList.toggle('active', tab === 'slots');
  document.getElementById('page-inv').classList.toggle('active', tab === 'inv');
  if (tab === 'inv') loadInventory();
}

async function spin() {
  if (spinning) return;
  spinning = true;
  
  const btn = document.getElementById('spinBtn');
  const msgDiv = document.getElementById('winMsg');
  
  btn.disabled = true;
  msgDiv.innerHTML = '🌀 КРУЧУ... 🌀';
  msgDiv.style.color = '#5a556e';
  
  try {
    const response = await fetch(`${API}/api/spin`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ init_data: initData })
    });
    const result = await response.json();
    
    if (result.error) {
      msgDiv.innerHTML = '❌ ' + result.error;
      spinning = false;
      btn.disabled = false;
      return;
    }
    
    console.log("🎰 РЕЗУЛЬТАТ:", result.type, result.symbols);
    
    // === 1. ПОКАЗЫВАЕМ КОМБИНАЦИЮ ===
    for (let i = 0; i < 3; i++) {
      const reelInner = document.getElementById(`ri${i}`);
      reelInner.innerHTML = '';
      
      // Создаем 3 видимых слота с эмодзи из сервера
      for (let j = 0; j < 3; j++) {
        const cell = document.createElement('div');
        cell.className = 'sym-cell';
        cell.textContent = getEmoji(result.symbols[j]);
        reelInner.appendChild(cell);
      }
      
      // Добавляем еще 6 для анимации (чтоб было больше 3)
      for (let j = 0; j < 6; j++) {
        const cell = document.createElement('div');
        cell.className = 'sym-cell';
        cell.textContent = getEmoji(result.symbols[j % 3]);
        reelInner.appendChild(cell);
      }
      
      // Анимация прокрутки
      reelInner.style.transition = 'none';
      reelInner.style.transform = 'translateY(0px)';
      
      setTimeout(() => {
        const totalHeight = reelInner.children.length * 92;
        const targetY = totalHeight - (3 * 92);
        reelInner.style.transition = 'transform 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1)';
        reelInner.style.transform = `translateY(-${targetY}px)`;
      }, i * 80);
    }
    
    // Ждем окончания анимации
    await new Promise(r => setTimeout(r, 600));
    
    // === 2. ОБНОВЛЯЕМ БАЛАНС И СТАТИСТИКУ ===
    document.getElementById('balVal').textContent = result.balance;
    stats.spins++;
    
    // === 3. ПОКАЗЫВАЕМ РЕЗУЛЬТАТ ===
    if (result.type === 'jackpot') {
      msgDiv.innerHTML = '🎉🎉🎉 ДЖЕКПОТ! СИГАРА! +1000 ⭐ 🎉🎉🎉';
      msgDiv.style.color = '#f0b429';
      stats.won++;
      showToast('🔥 ДЖЕКПОТ! Выиграл СИГАРУ! 🔥');
    } 
    else if (result.type === 'three') {
      msgDiv.innerHTML = `🎁 ПОЗДРАВЛЯЮ! Вы выиграли ПОДАРОК: ${result.gift.name}! 🎁`;
      msgDiv.style.color = '#f0b429';
      stats.won++;
      showToast(`🎁 ${result.gift.name} добавлен в инвентарь!`);
    } 
    else if (result.type === 'two') {
      msgDiv.innerHTML = '✨ +5 ЗВЁЗД ✨ (два одинаковых символа)';
      msgDiv.style.color = '#3ddc84';
    } 
    else {
      msgDiv.innerHTML = '😔 МИМО... Попробуй ещё! 😔';
      msgDiv.style.color = '#5a556e';
    }
    
    document.getElementById('sSpins').textContent = stats.spins;
    document.getElementById('sWon').textContent = stats.won;
    
  } catch (err) {
    console.error(err);
    msgDiv.innerHTML = '❌ Ошибка соединения';
  }
  
  spinning = false;
  btn.disabled = false;
}

async function loadInventory() {
  const cont = document.getElementById('invContent');
  cont.innerHTML = '🔄 Загрузка...';
  try {
    const res = await fetch(`${API}/api/inventory?init_data=${encodeURIComponent(initData)}`);
    const data = await res.json();
    const items = data.items || [];
    if (!items.length) {
      cont.innerHTML = '📭 Инвентарь пуст\nВыиграйте подарок в слотах!';
      return;
    }
    const grid = document.createElement('div');
    grid.className = 'inv-grid';
    const letters = { 'Сигара': 'С', 'Факел': 'Ф', 'Рамен': 'Р', 'Змея': 'З', 'Мороженое': 'М', 'Happy B-day': 'Д' };
    const emojiMap = { 'Сигара': '🚬', 'Факел': '🔥', 'Рамен': '🍜', 'Змея': '🐍', 'Мороженое': '🍦', 'Happy B-day': '🎂' };
    
    items.forEach(item => {
      const div = document.createElement('div');
      div.className = 'inv-card';
      div.innerHTML = `<div class="inv-letter">${letters[item.gift_name] || '?'}</div>
                       <div>${emojiMap[item.gift_name] || '🎁'} ${item.gift_name}</div>
                       <button class="withdraw-btn" onclick="withdraw(${item.id}, this)">📤 ВЫВЕСТИ</button>`;
      grid.appendChild(div);
    });
    cont.innerHTML = '';
    cont.appendChild(grid);
  } catch(e) {
    cont.innerHTML = '❌ Ошибка загрузки';
  }
}

async function withdraw(itemId, btn) {
  btn.disabled = true;
  btn.textContent = '⏳';
  try {
    const res = await fetch(`${API}/api/withdraw`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ init_data: initData, item_id: itemId })
    });
    const data = await res.json();
    if (data.ok) {
      btn.closest('.inv-card')?.remove();
      showToast('✅ Запрос отправлен администратору!');
      setTimeout(() => loadInventory(), 1000);
    } else {
      btn.disabled = false;
      btn.textContent = '📤 ВЫВЕСТИ';
    }
  } catch(e) {
    btn.disabled = false;
    btn.textContent = '📤 ВЫВЕСТИ';
  }
}

function showToast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function togglePt(btn) {
  document.getElementById('ptBox').classList.toggle('open');
}

async function loadBalance() {
  try {
    const r = await fetch(`${API}/api/balance?init_data=${encodeURIComponent(initData)}`);
    const d = await r.json();
    document.getElementById('balVal').textContent = d.balance ?? 0;
  } catch {}
}

// Стартовая заглушка
function initDemo() {
  const demo = [["🍌","🍌","🍌"], ["🍋","🍋","🍋"], ["🍏","🍏","🍏"]];
  for (let i = 0; i < 3; i++) {
    const reel = document.getElementById(`ri${i}`);
    reel.innerHTML = '';
    for (let j = 0; j < 3; j++) {
      const cell = document.createElement('div');
      cell.className = 'sym-cell';
      cell.textContent = demo[i][j];
      reel.appendChild(cell);
    }
    for (let j = 0; j < 6; j++) {
      const cell = document.createElement('div');
      cell.className = 'sym-cell';
      cell.textContent = demo[i][j % 3];
      reel.appendChild(cell);
    }
  }
}

initDemo();
loadBalance();
</script>
</body>
</html>
